<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Document sans nom</title>
<style>
:root {
    /* Colors */
    --background: #c7c6bf;
	
    /* Fonts */
    --font1: 'GOTHIC', sans-serif;

    /* Sizes Fonts */
	--size1: 12px;

}	
	
/* FONTS */
@font-face {font-family: 'GOTHIC';src: url('fonts/GOTHIC.ttf') format('truetype');}
	
/* BACKGROUND / TEXTURE GRAIN */
html, body {
    min-height: 100%;
}
body {
    position: relative;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--background);
    font-family: var(--font1);
	font-size: var(--size1);
    transition: all 0.3s ease;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.14;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
}
	
	
.alderia_main{
	position: relative;
	margin: 0 auto;
	padding: 0;
	width: 1022px;
}
.alderia_main_top{
	width: 100%;
	height: 10px;
	background-image: url("images/main-top.png");
	background-position: bottom center;
	background-repeat: no-repeat;
}
.alderia_main_center{
	padding: 0 11px 0 11px;
	background-image: url("images/main-center.png");
	background-position: top center;
	background-repeat: repeat-y;
}
	
.main_content{
	width: 100%;
	
	height: 550px;

	background: linear-gradient(0deg, rgba(240, 228, 234, 1) 0%, rgba(213, 213, 212, 1) 30%, rgba(213, 213, 212, 1) 50%, rgba(213, 213, 212, 1) 70%, rgba(240, 227, 234, 1) 100%);
}	
	
.alderia_main_bottom{
	width: 100%;
	height: 10px;
	background-image: url("images/main-bottom.png");
	background-position: top center;
	background-repeat: no-repeat;
}	
</style>	
</head>

<body>

<div style="height: 40px;"></div>	
	
<div class="alderia_main">
	<div class="alderia_main_top"></div>
	<div class="alderia_main_center">
		
		<div class="main_content">
			<center>tttttttttttttttt<br>aaaaaaaaaaaaaaa<br>aaaaaaaaaaaaaaa<br>aaaaaaaaaaaaaaa<br>aaaaaaaaaaaaaaa<br>aaaaaaaaaaaaaaa<br>aaaaaaaaaaaaaaa</center>
			
		</div>	
		
	</div>
	<div class="alderia_main_bottom"></div>
</div>	
	
</body>
</html>
